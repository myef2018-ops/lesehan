name: Hapus index.php placeholder
on:
  workflow_dispatch:
jobs:
  hapus-index-php:
    name: Hapus index.php
    runs-on: ubuntu-latest
    steps:
      - name: Hapus index.php dari public_html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, socket, ssl
          from ftplib import FTP_TLS
          from io import BytesIO
          socket.setdefaulttimeout(30)
          ctx = ssl._create_unverified_context()
          ftps = FTP_TLS(os.environ['FTP_HOST'], context=ctx)
          ftps.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftps.prot_p()
          ftps.cwd('public_html')
          names = ftps.nlst()
          print('Isi public_html sebelum:', names)
          if 'index.php' not in names:
              print('index.php tidak ada di public_html, tidak ada yang dihapus')
          else:
              buf = BytesIO()
              ftps.retrbinary('RETR index.php', buf.write)
              isi = buf.getvalue().decode('utf-8', 'ignore').lower()
              if 'gerbang anda untuk mendunia' in isi or 'thinkbig' in isi or 'hapus file index.php' in isi:
                  ftps.delete('index.php')
                  print('index.php placeholder BERHASIL dihapus')
              else:
                  print('index.php BUKAN placeholder (isi tidak cocok), TIDAK dihapus. Awal isi:', isi[:200])
          print('Isi public_html sesudah:', ftps.nlst())
          ftps.quit()
          EOF
